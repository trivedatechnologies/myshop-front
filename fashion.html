<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
}

.navbar{
    background:#4f46e5;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.cart-btn{
    background:white;
    color:#4f46e5;
    padding:10px 15px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

h1{
    text-align:center;
    margin:30px 0;
    color:#333;
}

.products{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}
.nav-link{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:16px;
    font-weight:500;
}
.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.card-body h3{
    margin-bottom:10px;
}

.price{
    color:#28a745;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}.nav-link{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:16px;
    font-weight:500;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#4f46e5;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#3730a3;
}
</style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KVJMRR67"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="navbar">
    <div class="logo">My Shop</div>
     <div>
     <a href="checkout.html" class="nav-link">🛒 Cart(<span id="cartCount">0</span>)</a>
     <a href="login.html" class="nav-link">🚪 Logout</a>
 </div>
</div>


<div class="products" id="products"></div>

<script>

const fashionCategories = [

{
id:1,
name:"Men's Wear",
image:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=600",
description:"Shirts, T-Shirts, Jeans and Jackets"
},

{
id:2,
name:"Women's Wear",
image:"https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=600",
description:"Dresses, Tops, Kurtis and Sarees"
},

{
id:3,
name:"Footwear",
image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600",
description:"Shoes, Sneakers and Sandals"
},

{
id:4,
name:"Bags",
image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600",
description:"Handbags, Backpacks and Travel Bags"
},

{
id:5,
name:"Accessories",
image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600",
description:"Sunglasses, Watches and Belts"
}

];

const productDiv =
document.getElementById("products");

fashionCategories.forEach(category=>{

productDiv.innerHTML += `

<div class="card">

<img src="${category.image}">

<div class="card-body">

<h3>${category.name}</h3>

<p class="description">
${category.description}
</p>

<a href="fashion-detail.html?id=${category.id}">
    <button>
        View Products
    </button>
</a>

</div>

</div>

`;

});
function updateCartCount() {

    let cart =
    JSON.parse(localStorage.getItem("cart"))
    || [];

    let totalQty = 0;

    cart.forEach(item => {
        totalQty += item.quantity || 1;
    });

    const cartCount =
    document.getElementById("cartCount");

    if(cartCount){
        cartCount.innerText = totalQty;
    }
}

updateCartCount();

function logout(){

    localStorage.removeItem("token");

    alert("Logged Out Successfully");
    dataLayer.push({
    event: "logout"
});
    window.location.href =
    "login.html";
}


function goBack(){
    window.history.back();
}
window.addEventListener("pageshow", function () {
    updateCartCount();
});
</script>
<button class="back-btn" onclick="goBack()">
    ← Back
</button>
</body>
</html>
