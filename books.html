<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Books</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
}

.navbar{
    background:#4f46e5;
    color:white;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.cart-btn{
    background:white;
    color:#4f46e5;
    padding:10px 15px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

h1{
    text-align:center;
    margin:30px 0;
    color:#333;
}

.products{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    transition:.3s;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.card-body h3{
    margin-bottom:10px;
}

.price{
    color:#28a745;
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#4f46e5;
    color:white;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}
.nav-link{
    color:white;
    text-decoration:none;
    margin-left:20px;
    font-size:16px;
    font-weight:500;
}
button:hover{
    background:#3730a3;
}
</style>
</head>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KVJMRR67"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<div class="navbar">
    <div class="logo">MyShop</div>
    <div>
     <a href="checkout.html" class="nav-link">🛒 Cart(<span id="cartCount">0</span>)</a>
     <a href="login.html" class="nav-link">🚪 Logout</a>
 </div>
</div>

<div class="products" id="products"></div>

<script>

const bookCategories = [

{
id:1,
name:"Programming Books",
image:"https://images.unsplash.com/photo-1512820790803-83ca734da794?w=800",
description:"Java, Python, C++, C Programming and Software Development Books"
},

{
id:2,
name:"Web Development Books",
image:"https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=800",
description:"HTML, CSS, JavaScript, React and Full Stack Development"
},

{
id:3,
name:"Database Books",
image:"https://images.unsplash.com/photo-1544383835-bda2bc66a55d?w=800",
description:"SQL, MySQL, Oracle and Database Management Systems"
},

{
id:4,
name:"Data Science Books",
image:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=800",
description:"Data Analytics, Statistics and Machine Learning"
},

{
id:5,
name:"Artificial Intelligence Books",
image:"https://images.unsplash.com/photo-1677442136019-21780ecad995?w=800",
description:"AI, Deep Learning, Neural Networks and Generative AI"
}

];  

const productDiv =
document.getElementById("products");

bookCategories.forEach(category=>{

productDiv.innerHTML += `

<div class="card">

<img src="${category.image}">

<div class="card-body">

<h3>${category.name}</h3>

<p class="description">
${category.description}
</p>

<a href="book-detail.html?id=${category.id}">
    <button>
        View Products
    </button>
</a>

</div>

</div>

`;

});


function updateCartCount() {

    let cart =
    JSON.parse(localStorage.getItem("cart"))
    || [];

    let totalQty = 0;

    cart.forEach(item => {
        totalQty += item.quantity || 1;
    });

    const cartCount =
    document.getElementById("cartCount");

    if(cartCount){
        cartCount.innerText = totalQty;
    }
}

updateCartCount();
function logout(){

    localStorage.removeItem("token");

    alert("Logged Out Successfully");
   dataLayer.push({
    event: "logout"
});
    window.location.href =
    "login.html";
}

function goBack(){
    window.history.back();
}
window.addEventListener("pageshow", function () {
    updateCartCount();
});
</script>
<button class="back-btn" onclick="goBack()">
    ← Back
</button>
</body>
</html>
